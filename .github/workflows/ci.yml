name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      XLA_FLAGS: --xla_force_host_platform_device_count=1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests

  ravel-smoke:
    name: RAVEL SB1/SB2 smoke
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "True"
      MINATO_RUN_RAVEL_SMOKE: "1"
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      XLA_FLAGS: --xla_force_host_platform_device_count=1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Run reduced probabilistic fits
        run: uv run --frozen python -m unittest tests.test_ravel

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
      - name: Check lock file
        run: uv lock --check
      - name: Build wheel and source archive
        run: uv build
